name: Build Windows EXE

# Builds a standalone Windows .exe on a real Windows runner with Python
# 3.13 (PySide6 + PyInstaller don't support 3.14 yet). Produces a
# downloadable artifact containing dist/TaskRip/.
#
# Triggers automatically on push to the dev branch, and can be run
# manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/setup-task-manager-app-NcPiH
    paths:
      - "taskmanager/**"
      - "run_app.py"
      - "taskmanager.spec"
      - "build_exe.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        env:
          TESSERACT_PATH: C:\Program Files\Tesseract-OCR
        run: python build_exe.py

      - name: Verify the executable exists
        run: |
          if (-Not (Test-Path "dist\TaskRip\TaskRip.exe")) {
            Write-Error "Build did not produce dist\TaskRip\TaskRip.exe"
            exit 1
          }
          Get-Item "dist\TaskRip\TaskRip.exe" | Format-List Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TaskRip-windows-x64
          path: dist/TaskRip/
          if-no-files-found: error
